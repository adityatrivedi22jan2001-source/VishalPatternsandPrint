<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enquiry Received | Vishal Patterns & Print</title>
<link rel="icon" href="assets/logo-nav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1c1712; --gold:#dcc182; }
  *{box-sizing:border-box}
  body{margin:0;background:#171310;color:#fff;font-family:"Work Sans",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;line-height:1.65}
  .box{max-width:640px;padding:60px 40px;text-align:left}
  .eyebrow{color:var(--gold);letter-spacing:.09em;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px}
  .eyebrow::before{content:"";width:20px;height:1px;background:var(--gold);display:inline-block}
  .logo{width:52px;margin-bottom:28px;opacity:.9}
  .box h1{font:400 clamp(38px,6vw,64px)/1.05 "Fraunces",Georgia,serif;margin:18px 0 20px;letter-spacing:-.01em}
  .box p{color:#c9bda9;font-size:16.5px;max-width:52ch}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:32px;border:1px solid rgba(255,255,255,.35);color:#fff;padding:14px 22px;text-decoration:none;font-size:13px;letter-spacing:.06em;transition:.25s}
  .btn:hover{background:rgba(255,255,255,.08);border-color:#fff}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="assets/logo-nav.png" alt="Vishal Patterns & Print">
  <div class="eyebrow">Thank you</div>
  <h1>Enquiry received.</h1>
  <p>Your wholesale enquiry has been submitted. Our team will review your requirement and get back to you using the details you provided.</p>
  <a class="btn" href="index.html">Back to the website</a>
</div>
</body>
</html>
